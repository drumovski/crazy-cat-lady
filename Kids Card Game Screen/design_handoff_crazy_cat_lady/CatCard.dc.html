<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{handleClick}}" style="width:{{width}}px; aspect-ratio:5/7; border-radius:{{radius}}px; background:{{bg}}; color:{{textColor}}; display:flex; align-items:center; justify-content:center; position:relative; box-shadow:var(--shadow-sm); border:{{borderStyle}}; flex-shrink:0; user-select:none; cursor:{{cursorStyle}}; transform:translateY({{liftPx}}px);" style-hover="box-shadow:var(--shadow-md); filter:brightness(1.04);">
  <sc-if value="{{faceUp}}" hint-placeholder-val="{{true}}">
    <span style="position:absolute; top:{{rankTop}}px; left:{{rankTop}}px; font-family:var(--font-body); font-weight:700; font-size:{{rankSize}}px; line-height:1;">{{rank}}</span>
  </sc-if>
  <svg viewBox="0 0 24 24" width="{{iconSize}}" height="{{iconSize}}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 9 L7.5 4 L10 9"></path>
    <path d="M19 9 L16.5 4 L14 9"></path>
    <path d="M5 9 C5 15.5 8 19 12 19 C16 19 19 15.5 19 9 C16.5 10.3 14 11 12 11 C10 11 7.5 10.3 5 9 Z"></path>
    <circle cx="9.3" cy="13.3" r="0.55" fill="currentColor"></circle>
    <circle cx="14.7" cy="13.3" r="0.55" fill="currentColor"></circle>
    <path d="M12 14.6 L12 15.6 M9.8 16.6 Q12 18 14.2 16.6"></path>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:90,&quot;height&quot;:126},&quot;rank&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number|string&quot;},&quot;bg&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;faceDown&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;width&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;selected&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const width = Number(this.props.width) || 72;
    const faceDown = !!this.props.faceDown;
    const selected = !!this.props.selected;
    return {
      width,
      bg: faceDown ? 'var(--color-accent-700)' : (this.props.bg || 'var(--color-neutral-300)'),
      textColor: faceDown ? 'var(--color-bg)' : (this.props.text || 'var(--color-neutral-900)'),
      faceUp: !faceDown,
      rank: this.props.rank != null ? this.props.rank : '',
      handleClick: this.props.onClick || (() => {}),
      iconSize: Math.round(width * 0.5),
      radius: Math.max(3, Math.round(width * 0.07)),
      rankTop: Math.round(width * 0.08),
      rankSize: Math.max(10, Math.round(width * 0.16)),
      borderStyle: selected ? '3px solid var(--color-accent)' : '2px solid rgba(32,30,29,0.15)',
      liftPx: selected ? -14 : 0,
      cursorStyle: this.props.onClick ? 'pointer' : 'default',
    };
  }
}
</script>
</body>
</html>
